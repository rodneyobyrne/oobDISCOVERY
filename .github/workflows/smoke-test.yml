name: Smoke Test Production Discovery

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public site over HTTPS
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 \
              https://discovery.oobcreative.com/ -o /tmp/site.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Public site did not become reachable over HTTPS." >&2
              exit 1
            fi
            sleep 10
          done
          grep -q "oobCREATIVE Discovery" /tmp/site.html
          curl --fail --silent --show-error --location --max-time 20 \
            https://discovery.oobcreative.com/src/system-config.js -o /tmp/system-config.js
          grep -q 'submissionEndpoint: "https://api.oobcreative.com/discovery/submit/"' /tmp/system-config.js

      - name: Verify API CORS preflight
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error \
            --output /tmp/preflight-body \
            --dump-header /tmp/preflight-headers \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://discovery.oobcreative.com' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            https://api.oobcreative.com/discovery/submit/)
          test "$status" = "204"
          grep -qi '^access-control-allow-origin: https://discovery.oobcreative.com' /tmp/preflight-headers
          grep -qi '^access-control-allow-methods: POST, OPTIONS' /tmp/preflight-headers

      - name: Submit synthetic clinician response
        run: |
          set -euo pipefail
          submission_id="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg submissionId "$submission_id" \
            --arg now "$now" \
            '{
              submissionId: $submissionId,
              system: "oobDISCOVERY",
              discoveryType: "clinician",
              systemVersion: "smoke-test",
              questionnaireVersion: "smoke-test-v1",
              client: {id: "system-smoke-test", label: "System Smoke Test"},
              respondent: {name: "Automated System Test", email: "", role: "Integration test"},
              timing: {startedAt: $now, generatedAt: $now},
              archetypes: [],
              patientPatterns: [],
              narrative: {testPurpose: "Synthetic end-to-end system verification; not a clinician response."},
              sourceIntegrity: {
                responseType: "clinician-self-report",
                patientIdentifyingInformationRequested: false,
                interpretationIncluded: false
              }
            }' > /tmp/payload.json

          status=$(curl --silent --show-error \
            --output /tmp/submit-response \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://discovery.oobcreative.com' \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            https://api.oobcreative.com/discovery/submit/)
          cat /tmp/submit-response
          test "$status" = "201"
          jq -e --arg id "$submission_id" '.ok == true and .submissionId == $id' /tmp/submit-response >/dev/null

          duplicate_status=$(curl --silent --show-error \
            --output /tmp/duplicate-response \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://discovery.oobcreative.com' \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            https://api.oobcreative.com/discovery/submit/)
          cat /tmp/duplicate-response
          test "$duplicate_status" = "409"
          jq -e '.ok == false' /tmp/duplicate-response >/dev/null
