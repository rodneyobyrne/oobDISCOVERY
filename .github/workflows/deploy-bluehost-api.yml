name: Deploy Bluehost API

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "server/api/**"
      - "server/lib/**"
      - "server/tools/**"
      - ".github/workflows/deploy-bluehost-api.yml"

permissions:
  contents: read

concurrency:
  group: deploy-bluehost-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare SSH
        env:
          BLUEHOST_SSH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
          BLUEHOST_SSH_HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
        run: |
          test -n "$BLUEHOST_SSH_KEY"
          test -n "$BLUEHOST_SSH_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BLUEHOST_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$BLUEHOST_SSH_HOST" >> ~/.ssh/known_hosts
          {
            printf 'Host %s\n' "$BLUEHOST_SSH_HOST"
            printf '  ControlMaster auto\n'
            printf '  ControlPath ~/.ssh/oob-%%C\n'
            printf '  ControlPersist 120\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Install private PHP dependencies
        run: composer install --working-dir=server --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build private results access config
        env:
          DISCOVERY_RESULTS_VIEWER: ${{ secrets.DISCOVERY_RESULTS_VIEWER }}
          DISCOVERY_RESULTS_PASSWORD_HASH: ${{ secrets.DISCOVERY_RESULTS_PASSWORD_HASH }}
          DISCOVERY_ACCOUNT_AUTH_ENABLED: ${{ secrets.DISCOVERY_ACCOUNT_AUTH_ENABLED }}
          DISCOVERY_SMTP_USERNAME: ${{ secrets.DISCOVERY_SMTP_USERNAME }}
          DISCOVERY_SMTP_PASSWORD: ${{ secrets.DISCOVERY_SMTP_PASSWORD }}
          DISCOVERY_SMTP_FROM_EMAIL: ${{ secrets.DISCOVERY_SMTP_FROM_EMAIL }}
        run: |
          test -n "$DISCOVERY_RESULTS_VIEWER"
          test -n "$DISCOVERY_RESULTS_PASSWORD_HASH"
          php -r '$enabled = filter_var(getenv("DISCOVERY_ACCOUNT_AUTH_ENABLED") ?: "false", FILTER_VALIDATE_BOOL); $smtp = ["host" => "smtp.gmail.com", "port" => 587, "username" => getenv("DISCOVERY_SMTP_USERNAME") ?: "", "password" => getenv("DISCOVERY_SMTP_PASSWORD") ?: "", "from_email" => getenv("DISCOVERY_SMTP_FROM_EMAIL") ?: "", "from_name" => "oobCREATIVE Discovery"]; if ($enabled && (trim($smtp["username"]) === "" || trim($smtp["password"]) === "" || !filter_var($smtp["from_email"], FILTER_VALIDATE_EMAIL))) { fwrite(STDERR, "Invited accounts are enabled but Google SMTP secrets are missing or invalid.\n"); exit(1); } $config = ["username" => getenv("DISCOVERY_RESULTS_VIEWER"), "password_hash" => getenv("DISCOVERY_RESULTS_PASSWORD_HASH"), "timezone" => "America/Denver", "account_auth" => ["enabled" => $enabled, "site_url" => "https://api.oobcreative.com", "vendor_autoload" => "/home1/reaqfvmy/oob-discovery-vendor/autoload.php", "smtp" => $smtp]]; file_put_contents("/tmp/oob-discovery-results.php", "<?php\ndeclare(strict_types=1);\nreturn " . var_export($config, true) . ";\n");'
          php -l /tmp/oob-discovery-results.php

      - name: Deploy API endpoints and results workspace
        env:
          BLUEHOST_SSH_HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
          BLUEHOST_SSH_USER: ${{ secrets.BLUEHOST_SSH_USER }}
        run: |
          test -n "$BLUEHOST_SSH_USER"
          ssh "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST" 'mkdir -p /home1/reaqfvmy/oob-discovery-lib /home1/reaqfvmy/oob-discovery-vendor /home1/reaqfvmy/api.oobcreative.com/discovery/submit /home1/reaqfvmy/api.oobcreative.com/discovery/results/invitations /home1/reaqfvmy/api.oobcreative.com/discovery/account/claim /home1/reaqfvmy/api.oobcreative.com/discovery/account/forgot /home1/reaqfvmy/api.oobcreative.com/discovery/account/confirm /home1/reaqfvmy/api.oobcreative.com/discovery/account/reset'
          scp server/lib/*.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/oob-discovery-lib/"
          scp -r server/vendor/* "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/oob-discovery-vendor/"
          scp server/api/discovery/submit/index.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/api.oobcreative.com/discovery/submit/index.php"
          scp server/api/discovery/results/index.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/api.oobcreative.com/discovery/results/index.php"
          scp server/api/discovery/results/invitations/index.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/api.oobcreative.com/discovery/results/invitations/index.php"
          scp server/api/discovery/account/claim/index.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/api.oobcreative.com/discovery/account/claim/index.php"
          scp server/api/discovery/account/forgot/index.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/api.oobcreative.com/discovery/account/forgot/index.php"
          scp server/api/discovery/account/confirm/index.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/api.oobcreative.com/discovery/account/confirm/index.php"
          scp server/api/discovery/account/reset/index.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/api.oobcreative.com/discovery/account/reset/index.php"
          scp /tmp/oob-discovery-results.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/oob-discovery-results.php"

      - name: Migrate account storage
        env:
          BLUEHOST_SSH_HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
          BLUEHOST_SSH_USER: ${{ secrets.BLUEHOST_SSH_USER }}
        run: |
          scp server/tools/migrate-db.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/oob-discovery-migrate.php"
          ssh "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST" '
            php /home1/reaqfvmy/oob-discovery-migrate.php
            code=$?
            rm -f /home1/reaqfvmy/oob-discovery-migrate.php
            exit $code
          '

      - name: Verify private configs and PHP
        env:
          BLUEHOST_SSH_HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
          BLUEHOST_SSH_USER: ${{ secrets.BLUEHOST_SSH_USER }}
        run: |
          ssh "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST" '
            test -f /home1/reaqfvmy/oob-discovery-config.php &&
            test -f /home1/reaqfvmy/oob-discovery-results.php &&
            chmod 600 /home1/reaqfvmy/oob-discovery-config.php /home1/reaqfvmy/oob-discovery-results.php /home1/reaqfvmy/oob-discovery-lib/*.php &&
            test "$(stat -c %a /home1/reaqfvmy/oob-discovery-config.php)" = "600" &&
            test "$(stat -c %a /home1/reaqfvmy/oob-discovery-results.php)" = "600" &&
            test -f /home1/reaqfvmy/oob-discovery-vendor/autoload.php &&
            find /home1/reaqfvmy/oob-discovery-lib /home1/reaqfvmy/api.oobcreative.com/discovery -type f -name "*.php" > /tmp/oob-discovery-php-files &&
            while IFS= read -r file; do php -l "$file" || exit 1; done < /tmp/oob-discovery-php-files &&
            rm -f /tmp/oob-discovery-php-files &&
            php -l /home1/reaqfvmy/oob-discovery-results.php
          '

      - name: Verify database storage contract
        env:
          BLUEHOST_SSH_HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
          BLUEHOST_SSH_USER: ${{ secrets.BLUEHOST_SSH_USER }}
        run: |
          scp server/tools/verify-db.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/oob-discovery-verify-db.php"
          ssh "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST" '
            php /home1/reaqfvmy/oob-discovery-verify-db.php
            code=$?
            rm -f /home1/reaqfvmy/oob-discovery-verify-db.php
            exit $code
          '

      - name: Verify account storage contract
        env:
          BLUEHOST_SSH_HOST: ${{ secrets.BLUEHOST_SSH_HOST }}
          BLUEHOST_SSH_USER: ${{ secrets.BLUEHOST_SSH_USER }}
        run: |
          scp server/tools/verify-auth.php "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST:/home1/reaqfvmy/oob-discovery-verify-auth.php"
          ssh "$BLUEHOST_SSH_USER@$BLUEHOST_SSH_HOST" '
            php /home1/reaqfvmy/oob-discovery-verify-auth.php
            code=$?
            rm -f /home1/reaqfvmy/oob-discovery-verify-auth.php
            exit $code
          '
