name: Validate Discovery

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate JavaScript
        run: |
          node --check src/app.js
          node --check src/bootstrap.js
          node --check src/system-config.js
          node --check config/clinician-core.js
          node --check config/varetto.js

      - name: Validate questionnaire configuration
        run: |
          node --input-type=module <<'NODE'
          import { clinicianCore } from './config/clinician-core.js';
          import { varettoConfig } from './config/varetto.js';
          const keys = clinicianCore.patternQuestions.map(question => question.key);
          if (new Set(keys).size !== keys.length) throw new Error('Pattern question keys must be unique.');
          if (clinicianCore.patternQuestions.length !== 11) throw new Error('Expected 11 audience-pattern questions.');
          if (varettoConfig.maxAudiencePatterns !== 5) throw new Error('Expected a five-worksheet collection limit.');
          if (!varettoConfig.baselineStudy || varettoConfig.baselineStudy.archetypes.length !== 4) throw new Error('Expected four source personas from the original study.');
          if (new Set(varettoConfig.baselineStudy.archetypes.map(item => item.id)).size !== 4) throw new Error('Source persona IDs must be unique.');
          for (const persona of varettoConfig.baselineStudy.archetypes) {
            if (!persona.fullStudyHtml || persona.fullStudyHtml.length < 1500) throw new Error(`${persona.id} must include the complete original study.`);
            if (!persona.profile || !Array.isArray(persona.profile.lifeContext)) throw new Error(`${persona.id} must include editable prefilled profile data.`);
            for (const field of ['feelings', 'questions', 'influencers', 'influencerQuestions', 'barriers']) {
              if (!Array.isArray(persona[field]) || persona[field].length < 2) throw new Error(`${persona.id}.${field} must preserve source-study context.`);
            }
          }
          for (const optionSet of ['audienceBasisOptions', 'evidenceSourceOptions', 'conditionOptions']) {
            const options = varettoConfig[optionSet];
            if (!Array.isArray(options) || options.length < 2) throw new Error(`${optionSet} is required.`);
            if (new Set(options.map(item => item.id)).size !== options.length) throw new Error(`${optionSet} IDs must be unique.`);
          }
          if (!varettoConfig.questionnaireVersion.endsWith('-v5')) throw new Error('Expected the v5 questionnaire contract.');
          NODE

      - name: Validate JSON schema
        run: node -e "JSON.parse(require('fs').readFileSync('schema/submission.schema.json', 'utf8'))"

      - name: Validate PHP
        run: |
          composer validate --working-dir=server --no-check-lock
          composer install --working-dir=server --no-dev --prefer-dist --no-interaction
          find server -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php server/tests/auth-contract.php
          php server/tests/runtime-config-contract.php
