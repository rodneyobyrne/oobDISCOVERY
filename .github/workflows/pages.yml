name: Deploy Discovery to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "CNAME"
      - "assets/**"
      - "clinician/**"
      - "config/**"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build public site artifact
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          cp -R assets clinician config src _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
